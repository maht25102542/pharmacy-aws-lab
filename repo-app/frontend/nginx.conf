# อยู่ใน image ของ frontend ที่ /etc/nginx/conf.d/default.conf
# Nginx ตัวนี้ทำ 2 หน้าที่: เสิร์ฟหน้าเว็บ และส่งต่อ /api ไปยัง backend
server {
    listen 80;
    client_max_body_size 10m;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        # "backend" คือชื่อ Service ใน Kubernetes ซึ่งแจกงานให้ backend ทุกตัว
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
