# ของจริงอยู่ที่: repo pharmacy-backend › .github/workflows/deploy.yml
name: deploy
on:
  pull_request: # เปิด/อัปเดต PR = ตรวจอย่างเดียว (ไม่ deploy)
    branches: [main, develop]
  push:
    branches: [develop] # merge PR เข้า develop = deploy dev อัตโนมัติ
    tags: ["v*"] # ติด tag บน main = deploy prd (ต้องมีคนอนุมัติ)

permissions:
  id-token: write # ขอ ID token (OIDC) ไม่ใส่ = ขอ role ไม่ได้
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: pharmacy/api
  CONTAINER_NAME: api # ต้องตรงชื่อ container ใน task definition

jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "lint / test / build ที่นี่ (ไม่ต้องใช้ role AWS)"

  deploy-dev:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<account>:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }} .
          docker push ${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}
      - id: td
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: pharmacy-api-dev
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.td.outputs.task-definition }}
          cluster: pharmacy-dev
          service: pharmacy-api
          wait-for-service-stability: true

  deploy-prd:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production # ตั้ง Required reviewers ที่ Settings › Environments · sub จะกลายเป็น environment:production
    steps:
      - uses: actions/checkout@v4
      # … เหมือน deploy-dev แต่ cluster: pharmacy-prd และ tag image = ${{ github.ref_name }}
