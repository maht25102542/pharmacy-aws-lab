# ของจริงอยู่ที่: ใน Kubernetes cluster namespace argocd
# apply ครั้งเดียวจาก VM pharmacy-k8s-1:  kubectl apply -f apps.yaml
# ก่อนใช้: แก้ YOUR_GITHUB_USER ให้เป็นชื่อบัญชี GitHub ของคุณ
#
# มีเฉพาะ prd: ต้องมีคนสั่ง sync (กดใน ArgoCD หรือติ๊ก AUTO_SYNC ใน Jenkins)
# dev ไม่ผ่าน ArgoCD แล้ว: รันด้วย docker compose บน VM pharmacy-dev (Jenkins ssh ไปสั่ง ดู vm-dev/)
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pharmacy-backend-prd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/pharmacy-manifests.git
    targetRevision: main
    path: prd/backend
  destination:
    server: https://kubernetes.default.svc
    namespace: prd
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pharmacy-frontend-prd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/pharmacy-manifests.git
    targetRevision: main
    path: prd/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: prd
