# Frontend ของ prd | ArgoCD app: pharmacy-frontend-prd
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: prd
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ecr-pull
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: frontend
      containers:
        - name: frontend
          image: WAITING_FOR_FIRST_JENKINS_DEPLOY
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
---
# NodePort 30080 คือประตูที่ load balancer ของ AWS ส่งคำขอเข้ามา
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: prd
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
