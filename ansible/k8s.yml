# เป้าหมาย: VM pharmacy-k8s-1, 2, 3 = cluster prd (k3s server 3 เครื่อง HA: etcd ในตัว วางคนละ AZ)
#           (VM pharmacy-dev ไม่ใช้ k3s แล้ว: dev = docker compose ดู dev.yml)
# ทุกเครื่องอยู่ private subnet: Ansible เข้าผ่าน bastion (ดู group_vars/internal.yml)
# ติดตั้ง Kubernetes (k3s), ArgoCD (ลงครั้งเดียวผ่านเครื่องแรก) และของพื้นฐานใน cluster
# ArgoCD ลงที่ cluster prd และคุมเฉพาะ prd

- name: First Kubernetes server (pharmacy-k8s-1)
  hosts: role_k8s_server[0]
  become: true
  tasks:
    # ต้องเริ่มด้วย --cluster-init เพื่อให้เครื่องอื่นมาเข้าร่วมเป็น server (etcd) ได้
    - name: Install k3s server
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io | sh -s - server
        --cluster-init
        --disable traefik
        --write-kubeconfig-mode 644
        --tls-san {{ ansible_host }}
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for the join token
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token

    - name: Read the join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token

    - name: Keep the token for the join play
      ansible.builtin.set_fact:
        k3s_token: "{{ node_token.content | b64decode | trim }}"

- name: Join the other Kubernetes servers one at a time (pharmacy-k8s-2, 3)
  hosts: role_k8s_server[1:]
  become: true
  serial: 1
  vars:
    first: "{{ groups['role_k8s_server'][0] }}"
  tasks:
    - name: Install k3s server and join the cluster
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io |
        K3S_TOKEN={{ hostvars[first].k3s_token }}
        sh -s - server
        --server https://{{ hostvars[first].private_ip_address }}:6443
        --disable traefik
        --write-kubeconfig-mode 644
        --tls-san {{ ansible_host }}
      args:
        creates: /usr/local/bin/k3s

- name: Cluster add-ons (pharmacy-k8s-1 = prd + ArgoCD)
  hosts: role_k8s_server[0]
  become: true
  vars:
    namespaces: ['prd']
    galera_ips: "{{ groups['role_db'] | map('extract', hostvars, 'private_ip_address') | list }}"
  tasks:
    - name: Wait until the node is ready
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=60s
      register: node_ready
      until: node_ready.rc == 0
      retries: 10
      delay: 10
      changed_when: false

    - name: Render base objects (namespace, DB service, DB secret)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../vm-k8s/cluster-base.yaml.j2"
        dest: /opt/cluster-base.yaml
        mode: "0600"

    - name: Apply base objects
      ansible.builtin.command: k3s kubectl apply -f /opt/cluster-base.yaml
      changed_when: true

    - block:
      - name: Create argocd namespace
        ansible.builtin.shell: >
          k3s kubectl create namespace argocd --dry-run=client -o yaml |
          k3s kubectl apply -f -
        changed_when: true

      - name: Install ArgoCD
        ansible.builtin.command: >
          k3s kubectl apply --server-side --force-conflicts -n argocd
          -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        changed_when: true

      - name: Expose ArgoCD on NodePort 30443
        ansible.builtin.command: >
          k3s kubectl -n argocd patch svc argocd-server
          -p '{"spec":{"type":"NodePort","ports":[{"name":"https","port":443,"targetPort":8080,"nodePort":30443}]}}'
        changed_when: true

    - name: Install AWS CLI (ใช้ขอรหัสผ่านชั่วคราวของ ECR)
      ansible.builtin.command:
        cmd: snap install aws-cli --classic
        creates: /snap/bin/aws

    - name: Copy ECR refresh script to /usr/local/bin
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../vm-k8s/ecr-refresh.sh"
        dest: /usr/local/bin/ecr-refresh.sh
        mode: "0755"

    - name: Write /etc/default/ecr-refresh
      ansible.builtin.copy:
        dest: /etc/default/ecr-refresh
        mode: "0644"
        content: |
          AWS_REGION={{ aws_region }}
          ECR_REGISTRY={{ ecr_registry }}
          NAMESPACES="{{ namespaces | join(' ') }}"

    - name: Copy systemd units to /etc/systemd/system
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../vm-k8s/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - ecr-refresh.service
        - ecr-refresh.timer

    - name: Enable the timer
      ansible.builtin.systemd:
        name: ecr-refresh.timer
        state: started
        enabled: true
        daemon_reload: true

    - name: Run the refresh once now
      ansible.builtin.systemd:
        name: ecr-refresh.service
        state: started
