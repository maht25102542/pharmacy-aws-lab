# ให้ Ansible ถามหาเครื่องจาก AWS เอง โดยดูจากป้ายที่ Terraform ติดไว้
# กลุ่มตามหน้าที่: role_bastion, role_jenkins, role_sonarqube, role_k8s_server, role_k8s_dev, role_db
# กลุ่ม internal: ทุกเครื่องยกเว้น bastion ต่อผ่าน bastion ด้วย private IP (ดู group_vars/internal.yml)
# ทดสอบ: ansible-inventory --graph
plugin: amazon.aws.aws_ec2
regions:
  - ap-southeast-1
filters:
  tag:Project: pharmacy
  instance-state-name: running
hostnames:
  - tag:Name
keyed_groups:
  - key: tags.Role
    prefix: role
groups:
  internal: "tags.Role != 'bastion'"
compose:
  # bastion ต่อด้วย public IP · เครื่องอื่นต่อด้วย private IP (ผ่าน bastion) เพราะ SG ของเครื่องภายในรับ SSH จาก bastion เท่านั้น
  ansible_host: "public_ip_address if tags.Role == 'bastion' else private_ip_address"
