# ของจริงอยู่ที่: ราก repo pharmacy-backend (SonarQube scanner อ่านไฟล์นี้)
sonar.projectKey=pharmacy-backend
sonar.projectName=Pharmacy Backend
sonar.sources=config,stock
sonar.tests=stock/tests
sonar.python.version=3.12
# migration สร้างอัตโนมัติ ไม่ต้องตรวจ · Jenkinsfile ไม่ใช่โค้ดแอป
sonar.exclusions=**/migrations/**,**/tests/**
